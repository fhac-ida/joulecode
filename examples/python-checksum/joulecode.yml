version: 1
language: python

test:
  command: pytest -q -p no:cacheprovider tests
  timeout_s: 120

benchmark:
  command: python bench/run.py
  timeout_s: 900
  min_duration_s: 20
  env:
    BENCH_ROUNDS: "104"  # calibrated on the measuring host (suite.py check): >= 20 s per run

limits:
  cpus: 1.0
  memory: 512m

measurement:
  repetitions: 10
  warmup: 1
  cooldown_s: 5
  seed: 42

profile:
  env:
    BENCH_ROUNDS: "8"

optimize:
  # Negative control: the Python functions have hardly any own time (the work happens in C).
  # min_share 0 still forces hotspots so that optimiser and measurement run.
  min_share: 0.0
  hotspots: 2
  candidates_per_hotspot: 2
  repair_attempts: 1
  review_rounds: 1
  max_complexity_increase: 3
  combine: true
