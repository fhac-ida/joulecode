# Ollama for `joulecode optimize`. joule:code itself runs directly on the host
# (it needs Docker for the sandbox containers and reads the METRION output).
#
#   docker compose up -d
#   joulecode optimize examples/python-wordstats
#
# joule:code unloads the model before every measurement (keep_alive=0) and waits
# until the GPU is idle – LLM and measurement never run at the same time.
#
# Requires an NVIDIA GPU with the NVIDIA Container Toolkit. Without a GPU, remove
# the `deploy:` section below (the model then runs on the CPU, more slowly).
services:
  ollama:
    image: ollama/ollama:0.32.15
    container_name: joulecode-ollama
    ports:
      - "127.0.0.1:11434:11434"   # reachable from this machine only
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      # Unload the model after 1 min idle (in addition to the explicit unload).
      - OLLAMA_KEEP_ALIVE=1m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
              count: all

  # Pulls the model on first start: $JOULECODE_OLLAMA_MODEL (from .joulecode.env), default
  # qwen2.5-coder:14b. Which model fits your GPU: docs/installation.md#which-language-model.
  ollama-model-init:
    image: ollama/ollama:0.32.15
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${JOULECODE_OLLAMA_MODEL:-qwen2.5-coder:14b}"]

volumes:
  ollama_data:
